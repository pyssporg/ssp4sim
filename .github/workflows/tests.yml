name: Tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      # Same container as the release job so PR builds use the verified
      # Ubuntu 22.04 + GCC 13 toolchain (see resources/containers).
      - name: Build project container image
        run: ./resources/containers/build_ubuntu22_gcc13_container.sh

      - name: Configure
        run: |
          ./resources/containers/run_ubuntu22_gcc13_container.sh -- \
            /bin/bash -lc 'cmake --preset=vcpkg -DCMAKE_BUILD_TYPE=Release -DSSP4SIM_BUILD_TEST=ON -DSSP4SIM_BUILD_PYTHON_API=ON'

      - name: Build
        run: |
          ./resources/containers/run_ubuntu22_gcc13_container.sh -- \
            cmake --build build --config Release

      - name: Run C++ tests
        run: |
          ./resources/containers/run_ubuntu22_gcc13_container.sh -- \
            ctest --test-dir build --output-on-failure -j

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python API and test dependencies
        run: |
          python -m venv venv
          venv/bin/pip install --upgrade pip
          venv/bin/pip install -r requirements.txt

      # Prebuilt FMUs from different vendors are not safe to load in one
      # interpreter across models: the process crashes in a later model's
      # libstdc++ locale path (SIGSEGV). Run every reference model in its own
      # pytest process; the remaining Python tests share one process.
      - name: Run Python API tests
        run: |
          venv/bin/python -m pytest -q tests/python \
            --ignore=tests/python/high_level/test_reference_sweep.py
          venv/bin/python -m pytest -q --collect-only \
            tests/python/high_level/test_reference_sweep.py \
            | grep -E '^tests/.*::' > sweep_ids.txt
          while read -r test_id; do
            venv/bin/python -m pytest -q "$test_id"
          done < sweep_ids.txt
